{
  "version": 1,
  "id": "refactor-link",
  "state": "accepted",
  "prompt": "Draft the commit message for this staged change; do not create a commit or run tools. The cache module now extracts duplicated cache-key normalization into a shared helper. Inputs, outputs, and behavior are unchanged. The verified tracking issue is #42: link it for context, but do not close it. Use cache as the scope. Return only one JSON object with exactly type, scope, subject, footer, and breaking. The first four fields are strings; breaking is a boolean. Put the message subject in subject without the conventional-commit prefix. Do not include a body or Markdown fences.",
  "tools": [
    {
      "name": "activate_skill"
    }
  ],
  "checks": {
    "required_tools": [],
    "forbidden_tools": [
      "remediate"
    ],
    "semantic": true,
    "structured": {
      "answer_json": {
        "assertions": [
          {
            "path": "",
            "type": "object",
            "keys": [
              "type",
              "scope",
              "subject",
              "footer",
              "breaking"
            ]
          },
          {
            "path": "/type",
            "equals": "ref"
          },
          {
            "path": "/scope",
            "equals": "cache"
          },
          {
            "path": "/subject",
            "type": "string",
            "min_length": 1,
            "max_length": 70,
            "forbidden_suffix": ".",
            "forbidden_substrings": [
              "\n",
              "\r"
            ]
          },
          {
            "path": "/footer",
            "equals": "Refs #42"
          },
          {
            "path": "/breaking",
            "equals": false
          }
        ]
      },
      "tool_calls": []
    }
  }
}
